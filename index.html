<body>
<canvas id="bg" aria-hidden="true"></canvas><a class="skip" href="#main">تخطي إلى المحتوى</a><button class="tg" id="tg" aria-label="تبديل الوضع الليلي">🌓</button><header><h1>🎹 أكاديمية البيانو <small>· hussein piano</small></h1><p>تعلّم النظرية الموسيقية والعزف خطوة بخطوة</p><div class="hero" role="group" aria-label="اضغط على أي نوت للاستماع"><div class="ring" id="ring"></div></div></header>
<nav class="tabs" id="tabs" role="tablist" aria-label="أقسام التطبيق"></nav>
<main id="main" tabindex="-1"></main>
<footer class="ft">صُنع بحب · hussein piano 🎹</footer>
<div class="dock">
<div class="dk"><span class="hd">العزف بالفأرة أو اللمس أو لوحة المفاتيح</span><span class="ctl"><button class="mini" id="sl" aria-label="أوكتاف أهدأ">◀</button><button class="mini" id="sr" aria-label="أوكتاف أحد">▶</button><button class="mini" id="zm" aria-label="تكبير البيانو">⛶</button></span><label><input type="checkbox" id="lbl" checked> أسماء النوت</label></div>
<div class="sc" id="sc"><div id="piano"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const ARN=['دو','دو♯','ري','ري♯','مي','فا','فا♯','صول','صول♯','لا','لا♯','سي'];
const AR=['دو','ري','مي','فا','صول','لا','سي'];
const LI=[0,0,1,1,2,3,3,4,4,5,5,6];
const isB=m=>[1,3,6,8,10].includes(m%12);
const nm=s=>{const x=/^([A-G])([#b]?)(\d)$/.exec(s);return 12*(+x[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[x[1]]+(x[2]=='#'?1:x[2]=='b'?-1:0)};
const S=s=>s.split(' ').map(t=>{const[x,d]=t.split(':');return[x=='R'?null:x.includes('+')?x.split('+').map(nm):nm(x),d?+d:1]});
/* ---------- audio ---------- */
let C;const ac=()=>{C=C||new(window.AudioContext||window.webkitAudioContext)();if(C.state=='suspended')C.resume();return C};
let W;
function start(m){const c=ac();W=W||c.createPeriodicWave(new Float32Array([0,1,.5,.25,.12,.06]),new Float32Array(6));
const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),t=c.currentTime;
o.setPeriodicWave(W);o.frequency.value=440*2**((m-69)/12);f.type='lowpass';f.frequency.value=3200;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.12,t+.5);
o.connect(f);f.connect(g);g.connect(c.destination);o.start();
return()=>{const n=c.currentTime;g.gain.cancelScheduledValues(n);g.gain.setTargetAtTime(0,n,.1);o.stop(n+.7)}}
/* ---------- piano ---------- */
const KB={},held={};let hook=null;
const c1=['KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM'];
const c2=['KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7','KeyU'];
const keyOf={},lab={};c1.forEach((c,i)=>keyOf[c]=60+i);c2.forEach((c,i)=>keyOf[c]=72+i);
for(const c in keyOf)lab[keyOf[c]]=c.replace(/Key|Digit/,'');
(function(){const p=$('piano');let wi=0;
for(let m=48;m<=83;m++){const k=document.createElement('div');k.dataset.m=m;
if(isB(m)){k.className='k b';k.style.left=`calc(${wi}*var(--w) - var(--bw)/2)`}else{k.className='k w';wi++}
k.innerHTML=`<span class="t">${lab[m]||''}</span><span class="n">${isB(m)?'':ARN[m%12]}</span>`;


p.appendChild(k);KB[m]=k}
$('sc').scrollLeft=7*46-20})();
$('lbl').onchange=e=>$('piano').classList.toggle('nl',!e.target.checked);
function press(m,g){if(held[m])return;held[m]=start(m);KB[m].classList.add('on');if(navigator.vibrate&&!g)try{navigator.vibrate(6)}catch(e){}hook&&!g&&hook(m)}
function release(m){if(held[m]){held[m]();delete held[m];KB[m].classList.remove('on')}}
addEventListener('keydown',e=>{const m=keyOf[e.code];if(m&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!/INPUT/.test(e.target.tagName)){press(m)}});
addEventListener('keyup',e=>{const m=keyOf[e.code];if(m)release(m)});
/* ---------- sequences ---------- */
let timers=[];
function stopSeq(){timers.forEach(clearTimeout);timers=[];for(const m in KB)if(!held[m])KB[m].classList.remove('on')}
function playSeq(seq,bpm=90){stopSeq();const u=60000/bpm;let t=0;
seq.forEach(([n,b])=>{if(n!==null){const a=[].concat(n),st=[];
timers.push(setTimeout(()=>a.forEach(m=>{st.push(start(m));KB[m].classList.add('on')}),t));
timers.push(setTimeout(()=>{st.forEach(f=>f());a.forEach(m=>KB[m].classList.remove('on'))},t+b*u*.92))}t+=b*u})}
/* ---------- staff ---------- */
const dpos=m=>(Math.floor(m/12)-1)*7+LI[m%12];
function staff(ms){const w=70+ms.length*34,y=d=>75-(d-30)*5;
let s=`<svg class="staff" viewBox="0 0 ${w} 110" role="img" aria-label="مدرج موسيقي">`;
for(let i=0;i<5;i++)s+=`<line x1="4" x2="${w-4}" y1="${35+i*10}" y2="${35+i*10}"/>`;
s+=`<text class="clef" x="8" y="84" font-size="64">𝄞</text>`;
ms.forEach((m,i)=>{const d=dpos(m),cx=62+i*34,cy=y(d);
for(let l=28;l>=d;l-=2)s+=`<line x1="${cx-11}" x2="${cx+11}" y1="${y(l)}" y2="${y(l)}"/>`;
for(let l=40;l<=d;l+=2)s+=`<line x1="${cx-11}" x2="${cx+11}" y1="${y(l)}" y2="${y(l)}"/>`;
s+=`<ellipse cx="${cx}" cy="${cy}" rx="7" ry="5"/>`;
s+=d<34?`<line x1="${cx+6.5}" x2="${cx+6.5}" y1="${cy}" y2="${cy-30}"/>`:`<line x1="${cx-6.5}" x2="${cx-6.5}" y1="${cy}" y2="${cy+30}"/>`;
if(isB(m))s+=`<text x="${cx-21}" y="${cy+5}" font-size="14">♯</text>`});
return s+'</svg>'}
/* ---------- content ---------- */
const LESSONS=[
{t:'النوت الموسيقية السبع',h:`<p>تقوم الموسيقى على سبع نوت تتكرر في طبقات صوتية تسمى <b>أوكتافات</b>: دو (C) ري (D) مي (E) فا (F) صول (G) لا (A) سي (B).</p><p>على البيانو تتكرر مجموعة من مفتاحين أسودين ثم ثلاثة. نوت <b>دو</b> تقع دائماً قبل المفتاحين الأسودين مباشرة، فهي نقطة الانطلاق لحفظ لوحة المفاتيح.</p><p>المفتاح الأسود يعطي نوت بالتحويل: <b>الدييز ♯</b> يرفع النوت نصف درجة، و<b>البيمول ♭</b> يخفضها نصف درجة.</p><div class="note">جرّب: اضغط على أي مفتاح أبيض واقرأ اسمه المكتوب عليه.</div>`,st:'C4 D4 E4 F4 G4 A4 B4 C5',d:[['النوت السبع صعوداً','C4 D4 E4 F4 G4 A4 B4 C5'],['نزولاً','C5 B4 A4 G4 F4 E4 D4 C4']]},
{t:'المدرج الموسيقي ومفتاح صول',h:`<p>تُكتب النوت على <b>خمسة خطوط وأربع مسافات</b> تُعد من الأسفل إلى الأعلى. <b>مفتاح صول</b> يلتف حول الخط الثاني ويحدد مكان نوت صول.</p><p>الخطوط من الأسفل: <b>مي – صول – سي – ري – فا</b>. المسافات: <b>فا – لا – دو – مي</b>.</p><p>نوت دو الوسطى (C4) تُكتب على خط إضافي صغير تحت المدرج، وهي النوت الموجودة وسط البيانو تقريباً.</p>`,st:'C4 D4 E4 F4 G4 A4 B4 C5 D5',d:[['نوت الخطوط','E4 G4 B4 D5 F5'],['نوت المسافات','F4 A4 C5 E5']]},
{t:'القيم الزمنية والميزان',h:`<p>مدة النوت تُقاس بالضربات: <b>المستديرة</b> 4 ضربات، <b>البيضاء</b> ضربتان، <b>السوداء</b> ضربة، <b>الكروش (الثمن)</b> نصف ضربة.</p><p>الميزان <b>4/4</b> يعني أربع ضربات في كل مازورة، والضربة الأولى هي الأقوى. الميزان <b>3/4</b> يعطي إحساس الفالس.</p><div class="note">استخدم تبويب الإيقاع لتتدرب على العد مع المترونوم.</div>`,d:[['مستديرة، بيضاء، سوداء، ثمن','C4:4 R:1 C4:2 R:1 C4:1 C4:1 R:1 C4:.5 C4:.5 C4:.5 C4:.5']]},
{t:'السلم الكبير',h:`<p>السلم الكبير له صيغة ثابتة من الأبعاد: <b>طون – طون – نصف – طون – طون – طون – نصف</b>. (الطون = مفتاحان، نصف الطون = مفتاح واحد متجاور).</p><p>سلم دو الكبير لا يحتوي على مفاتيح سوداء. وإذا بدأت من صول وطبّقت الصيغة نفسها تحتاج إلى فا♯.</p>`,st:'C4 D4 E4 F4 G4 A4 B4 C5',d:[['سلم دو الكبير','C4 D4 E4 F4 G4 A4 B4 C5'],['سلم صول الكبير','G4 A4 B4 C5 D5 E5 F#5 G5']]},
{t:'السلم الصغير الطبيعي',h:`<p>صيغته: <b>طون – نصف – طون – طون – نصف – طون – طون</b>. طابعه حزين مقارنة بالكبير.</p><p>سلم لا الصغير هو «قريب» دو الكبير لأنهما يشتركان في النوت نفسها، لكن نقطة الارتكاز تختلف.</p>`,st:'A3 B3 C4 D4 E4 F4 G4 A4',d:[['سلم لا الصغير','A3 B3 C4 D4 E4 F4 G4 A4'],['سلم دو الصغير','C4 D4 Eb4 F4 G4 Ab4 Bb4 C5']]},
{t:'الفواصل (المسافات بين النوت)',h:`<p>الفاصلة هي المسافة بين نوتين وتُقاس بأنصاف الأطوان: ثانية كبيرة (2)، ثالثة كبيرة (4)، ثالثة صغيرة (3)، رابعة (5)، خامسة (7)، أوكتاف (12).</p><p>الثالثة الكبيرة تبدو <b>مشرقة</b> والثالثة الصغيرة تبدو <b>حزينة</b>، وهذا أساس التمييز بين الكبير والصغير.</p>`,d:[['ثالثة كبيرة','C4 E4 C4+E4:2'],['ثالثة صغيرة','C4 Eb4 C4+Eb4:2'],['خامسة','C4 G4 C4+G4:2'],['أوكتاف','C4 C5 C4+C5:2']]},
{t:'الأكوردات',h:`<p>الأكورد ثلاث نوت أو أكثر تُعزف معاً. أبسط شكل هو الثلاثي المبني على ثالثتين متتاليتين:</p><p>• <b>كبير</b>: ثالثة كبيرة ثم صغيرة (دو – مي – صول)<br>• <b>صغير</b>: ثالثة صغيرة ثم كبيرة (دو – مي♭ – صول)<br>• <b>متناقص</b>: ثالثتان صغيرتان، وصوته متوتر.</p>`,d:[['دو كبير','C4+E4+G4:3'],['دو صغير','C4+Eb4+G4:3'],['متناقص','C4+Eb4+Gb4:3'],['أربيج دو','C4 E4 G4 C5 G4 E4 C4+E4+G4:2']]},
{t:'التتابع الهارموني',h:`<p>أشهر التتابعات هو <b>I – IV – V – I</b>: ننتقل من أكورد الدرجة الأولى إلى الرابعة ثم الخامسة ونعود للأولى فنشعر بالاستقرار. في دو: دو – فا – صول – دو.</p><p>تتابع <b>I – V – vi – IV</b> تقوم عليه آلاف الأغاني الحديثة.</p>`,d:[['I – IV – V – I','C4+E4+G4:2 C4+F4+A4:2 B3+D4+G4:2 C4+E4+G4:4'],['I – V – vi – IV','C4+E4+G4:2 B3+D4+G4:2 C4+E4+A4:2 C4+F4+A4:2']]},
{t:'مدخل إلى المقامات العربية',h:`<p>المقامات العربية تعتمد سلالم مختلفة. مقام <b>الحجاز على الرِّي</b> يمكن عزفه على البيانو: ري – مي♭ – فا♯ – صول – لا – سي♭ – دو – ري، وفيه فاصلة «زائدة ثانية» بين مي♭ وفا♯.</p><div class="note">ملاحظة: مقامات مثل الراست والبياتي تحتوي على ربع تون (نصف بيمول) لا يمكن عزفه بدقة على البيانو العادي، لذلك يُستخدم تقريب فقط.</div>`,d:[['حجاز على الري','D4 Eb4 F#4 G4 A4 Bb4 C5 D5'],['نزولاً','D5 C5 Bb4 A4 G4 F#4 Eb4 D4']]},
{t:'الجلسة والأصابع',h:`<p>اجلس باستقامة، المرفقان بمستوى المفاتيح، والأصابع منحنية كأنك تمسك كرة صغيرة. الأصابع تُرقَّم من 1 (الإبهام) إلى 5 (الخنصر).</p><p>سلم دو الكبير باليد اليمنى: <b>1-2-3-1-2-3-4-5</b>، ويمرّ الإبهام تحت الإصبع الثالث بعد مي. ابدأ ببطء ثم زِد السرعة تدريجياً.</p>`,d:[['استمع للسلم بسرعة بطيئة','C4 D4 E4 F4 G4 A4 B4 C5',60]]},
{t:'دائرة الخامسات والتأشيرات',lv:'متوسط',h:`<p>التأشيرة هي الدييزات أو البيمولات المكتوبة بجانب المفتاح لتحديد السلم. في <b>دائرة الخامسات</b> كل صعود بمقدار خامسة (دو، صول، ري، لا، مي، سي، فا♯) يضيف دييزاً جديداً.</p><p>ترتيب الدييزات: <b>فا دو صول ري لا مي سي</b>، وترتيب البيمولات عكسه: <b>سي مي لا ري صول دو فا</b>. للتعرف السريع على سلم له دييزات: التونيك يكون أعلى آخر دييز بنصف طون.</p>`,d:[['ري كبير (دييزان)','D4 E4 F#4 G4 A4 B4 C#5 D5'],['فا كبير (بيمول واحد)','F4 G4 A4 Bb4 C5 D5 E5 F5'],['لا كبير (3 دييزات)','A3 B3 C#4 D4 E4 F#4 G#4 A4']]},
{t:'السلالم الصغيرة الثلاثة',lv:'متوسط',h:`<p>للسلم الصغير ثلاثة أشكال: <b>الطبيعي</b>، و<b>الهارموني</b> (الدرجة السابعة مرفوعة نصف طون لتصنع حساسة تقود إلى التونيك)، و<b>الميلودي</b> (السادسة والسابعة مرفوعتان صعوداً وتعودان طبيعيتين نزولاً).</p><p>في الهارموني فاصلة زائدة بين الدرجتين 6 و7 تعطيه نكهة شرقية قريبة من الحجاز.</p>`,st:'A3 B3 C4 D4 E4 F4 G#4 A4',d:[['لا هارموني','A3 B3 C4 D4 E4 F4 G#4 A4'],['لا ميلودي صعوداً ونزولاً','A3 B3 C4 D4 E4 F#4 G#4 A4 G4 F4 E4 D4 C4 B3 A3']]},
{t:'الأكوردات السباعية',lv:'متوسط',h:`<p>نضيف ثالثة فوق الثلاثي فنحصل على أكورد سباعي: <b>Cmaj7</b> ناعم وحالم، <b>C7</b> (دومينانت) متوتر يطلب الحل، <b>Cm7</b> دافئ، و<b>Cm7♭5</b> نصف متناقص يُستخدم كثيراً في الجاز.</p>`,d:[['Cmaj7','C4+E4+G4+B4:3'],['C7','C4+E4+G4+Bb4:3'],['Cm7','C4+Eb4+G4+Bb4:3'],['Cm7♭5','C4+Eb4+Gb4+Bb4:3']]},
{t:'قلب الأكورد والانتقال السلس',lv:'متوسط',h:`<p>للأكورد ثلاثة أوضاع: <b>أساسي</b> (الجذر في الأسفل)، <b>قلب أول</b> (الثالثة في الأسفل)، <b>قلب ثانٍ</b> (الخامسة في الأسفل).</p><p>نستخدم القلب لتقليل حركة اليد بين الأكوردات (Voice Leading): احتفظ بالنوت المشتركة وحرّك الباقي بأقل مسافة.</p>`,d:[['الأوضاع الثلاثة','C4+E4+G4:2 E4+G4+C5:2 G4+C5+E5:2'],['انتقال بقفزة','C4+E4+G4:2 G4+B4+D5:2 C4+E4+G4:3'],['انتقال سلس بالقلب','C4+E4+G4:2 B3+D4+G4:2 C4+E4+G4:3']]},
{t:'أكوردات السلم والدرجات',lv:'متوسط',h:`<p>كل درجة في السلم تبني أكورداً. في دو الكبير: <b>I دو (كبير)، ii ري (صغير)، iii مي (صغير)، IV فا (كبير)، V صول (كبير)، vi لا (صغير)، vii° سي (متناقص)</b>.</p><p>الأرقام الرومانية تسمح لك بنقل أي تتابع إلى أي سلم بسهولة.</p>`,d:[['أكوردات سلم دو','C4+E4+G4:1.5 D4+F4+A4:1.5 E4+G4+B4:1.5 F4+A4+C5:1.5 G4+B4+D5:1.5 A4+C5+E5:1.5 B4+D5+F5:1.5 C5+E5+G5:3']]},
{t:'مرافقة اليد اليسرى',lv:'متوسط',h:`<p>اليد اليسرى تحمل الأساس الهارموني والنبض بينما تغني اليمنى اللحن. أشهر الأنماط: <b>الأربيج الصاعد</b>، <b>باص ألبرتي</b> (أسفل – أعلى – وسط – أعلى)، و<b>الأوكتاف المكسور</b>.</p><p>تدرّب على اليسرى وحدها حتى تصبح آلية قبل ضم اليمنى.</p>`,d:[['باص ألبرتي على I–IV–V–I','C3 G3 E3 G3 C3 G3 E3 G3 F3 C4 A3 C4 F3 C4 A3 C4 G3 D4 B3 D4 G3 D4 B3 D4 C3+C4:4',170]]},
{t:'الإيقاعات المنقّطة والمتزامنة والثلاثيات',lv:'متوسط',h:`<p>النقطة بعد النوت تضيف نصف قيمتها: السوداء المنقطة = 1.5 ضربة. <b>الثلاثية</b> تقسم الضربة إلى ثلاثة أجزاء متساوية. <b>التزامن (Syncopation)</b> يضع التشديد بين الضربات أو على الضعيفة منها فيعطي حيوية.</p><div class="note">عُدّ بصوت مرتفع مع المترونوم: 1 و 2 و 3 و 4 و.</div>`,d:[['منقطة','C4:1.5 D4:.5 E4:1.5 F4:.5 G4:3'],['ثلاثيات','C4:.33 D4:.33 E4:.34 F4:.33 G4:.33 A4:.34 G4:2'],['تزامن','C4:.5 E4:1 G4:1 E4:.5 C4:1 G3:.5 C4:2']]},
{t:'القفلات (Cadences)',lv:'متوسط',h:`<p>القفلة هي نهاية العبارة الموسيقية: <b>الكاملة</b> V–I (إحساس بالنهاية)، <b>البلاغالية</b> IV–I (كلمة آمين)، <b>المعلّقة</b> تنتهي على V (كأنها سؤال)، <b>المخادعة</b> V–vi (مفاجأة).</p>`,d:[['كاملة V–I','B3+D4+G4:2 C4+E4+G4:3'],['بلاغالية IV–I','C4+F4+A4:2 C4+E4+G4:3'],['معلّقة','C4+E4+G4:2 B3+D4+G4:3'],['مخادعة V–vi','B3+D4+G4:2 C4+E4+A4:3']]},
{t:'التعبير الموسيقي والديناميكيات',lv:'متوسط',h:`<p>الديناميكيات: <b>pp</b> هادئ جداً، <b>p</b> هادئ، <b>mf</b> متوسط، <b>f</b> قوي، <b>ff</b> قوي جداً، و<b>cresc.</b> تصاعد تدريجي. أما الأداء فيتنوع بين <b>staccato</b> (قصير منقطع) و<b>legato</b> (متصل) و<b>accent</b> (تشديد).</p><p>دواسة السستين تطيل الرنين: ارفعها وأعد ضغطها عند كل تغيير أكورد حتى لا تختلط الأصوات.</p>`,d:[['Staccato','C4:.3 R:.7 D4:.3 R:.7 E4:.3 R:.7 F4:.3 R:.7 G4:.3'],['Legato','C4 D4 E4 F4 G4:2']]},
{t:'الأنماط الكنسية (Modes)',lv:'احترافي',h:`<p>الأنماط تنشأ من البدء بكل درجة من السلم الكبير: <b>أيوني</b> (الكبير)، <b>دورياني</b> (صغير بسادسة كبيرة، أجواء الجاز)، <b>فريجي</b> (طابع إسباني)، <b>ليدي</b> (حالم)، <b>ميكسوليدي</b> (بلوز وروك)، <b>إيوليان</b> (الصغير الطبيعي)، <b>لوكري</b>.</p><p>على المفاتيح البيضاء فقط ابدأ من الري للدورياني، ومن المي للفريجي، ومن الفا لليدي، ومن الصول للميكسوليدي.</p>`,d:[['دورياني على ري','D4 E4 F4 G4 A4 B4 C5 D5'],['فريجي على مي','E4 F4 G4 A4 B4 C5 D5 E5'],['ليدي على فا','F4 G4 A4 B4 C5 D5 E5 F5'],['ميكسوليدي على صول','G4 A4 B4 C5 D5 E5 F5 G5']]},
{t:'السلالم الخماسية والبلوز',lv:'احترافي',h:`<p>السلم <b>الخماسي</b> خمس نوت بلا أنصاف أطوان، لذا لا يعطي أي نغمة نشاز. <b>الخماسي الصغير</b> أساس الروك والبلوز، وإذا أضفت له الدرجة ♭5 (النوتة الزرقاء) حصلت على <b>سلم البلوز</b>.</p>`,d:[['خماسي دو الكبير','C4 D4 E4 G4 A4 C5'],['خماسي لا الصغير','A3 C4 D4 E4 G4 A4'],['سلم البلوز على لا','A3 C4 D4 Eb4 E4 G4 A4']]},
{t:'السلم الكامل والمتناقص',lv:'احترافي',h:`<p><b>السلم الكامل</b> كله أطوان (ست نوت)، صوته حالم غامض ويستخدمه ديبوسي. <b>السلم المتناقص</b> يتناوب طون ونصف، ويُستخدم فوق الأكوردات المتناقصة وفي الجاز.</p>`,d:[['كامل','C4 D4 E4 F#4 G#4 A#4 C5'],['متناقص (طون-نصف)','C4 D4 Eb4 F4 Gb4 Ab4 A4 B4 C5']]},
{t:'التحوّل بين السلالم (Modulation)',lv:'احترافي',h:`<p>التحول هو الانتقال من سلم إلى آخر داخل المقطوعة. أسهل طريقة: <b>الأكورد المحوري</b> المشترك بين السلمين. مثلاً Am هو vi في دو وهو ii في صول؛ ثم نضيف D7 (V7 صول) لنستقر على صول.</p>`,d:[['من دو إلى صول','C4+E4+G4:2 C4+E4+A4:2 D4+F#4+A4+C5:2 B3+D4+G4:2 G4+B4+D5:4']]},
{t:'أكوردات متقدمة: التسعات والمعلّقة',lv:'احترافي',h:`<p>الأكوردات الموسّعة تضيف ألواناً: <b>maj9</b> و<b>9</b> (نضيف التاسعة)، <b>add9</b>، <b>sus4/sus2</b> (نستبدل الثالثة فتصبح معلّقة تطلب الحل)، و<b>7♯9</b> (أكورد جيمي هندريكس).</p>`,d:[['Cmaj9','C4+E4+G4+B4+D5:3'],['C9','C4+E4+G4+Bb4+D5:3'],['Csus4 ثم C','C4+F4+G4:2 C4+E4+G4:3'],['Cadd9','C4+E4+G4+D5:3'],['C7♯9','C4+E4+G4+Bb4+D#5:3']]},
{t:'هارموني الجاز: ii–V–I والبلوز',lv:'احترافي',h:`<p>العمود الفقري للجاز هو <b>ii–V–I</b>: Dm7 ← G7 ← Cmaj7. ركّز على حركة الأصوات: السابعة في Dm7 (دو) تنزل إلى الثالثة في G7 (سي) ثم تستقر.</p><p><b>بلوز 12 مازورة</b>: 4 مازورات I7، 2 IV7، 2 I7، ثم V7 وIV7 وI7 وV7 للعودة.</p>`,d:[['ii–V–I في دو','D4+F4+A4+C5:2 B3+F4+G4+D5:2 C4+E4+G4+B4:4'],['بلوز مختصر','C4+E4+G4+Bb4:4 F4+A4+C5+Eb5:2 C4+E4+G4+Bb4:2 G3+B3+D4+F4:2 F4+A4+C5+Eb5:2 C4+E4+G4+Bb4:4',100]]},
{t:'التقنية الاحترافية',lv:'احترافي',h:`<p>قواعد الاحتراف: تدرّب <b>ببطء شديد</b> أولاً، يد واحدة ثم اليدان، قسّم المقطوعة إلى مقاطع قصيرة، واستخدم سلم المترونوم: ارفع السرعة 4 ضربات فقط كل مرة بعد نجاح ثلاث مرات متتالية بلا خطأ.</p><p>حافظ على المعصم مرتخياً والإبهام يمرّ بسلاسة، وسجّل نفسك واستمع لتكتشف أخطاءك. تمارين أوكتافين وأربيجات واسعة تبني الاستقلالية والسرعة.</p>`,d:[['سلم دو بأوكتافين','C4 D4 E4 F4 G4 A4 B4 C5 D5 E5 F5 G5 A5 B5',160],['أربيج واسع','C4 E4 G4 C5 E5 G5 C5 G4 E4 C4',140]]},
{t:'خطة التدريب اليومية',lv:'احترافي',h:`<p>جلسة مثالية مدتها 60 دقيقة:</p><p>• <b>5 د</b> إحماء وتمدد خفيف<br>• <b>10 د</b> سلالم وأربيجات<br>• <b>25 د</b> المقطوعة الحالية بمقاطع قصيرة<br>• <b>10 د</b> قراءة نوت من الورقة (Sight-reading)<br>• <b>5 د</b> تدريب الأذن<br>• <b>5 د</b> عزف حر وتأليف</p><p>الانتظام أهم من الطول: 30 دقيقة يومياً أفضل من ساعتين مرة بالأسبوع. خذ راحة 5 دقائق كل 25 دقيقة.</p>`,d:[]},
{t:'تدريب الأذن (Ear Training)',lv:'احترافي',h:`<p>تعلّم تمييز الفواصل بالسماع، واربط كل فاصلة بأغنية تعرفها: الخامسة تبدأ بها «لمعي لمعي يا نجمة»، والأوكتاف يبدأ بها «Somewhere Over the Rainbow».</p><p>اسمع الفاصلة ثم غنِّها قبل أن تعزفها، ثم اختبر نفسك: أغمض عينيك واطلب من صديق أن يعزف لك فاصلة عشوائية.</p>`,d:[['ثانية صغيرة','C4 Db4 C4+Db4:2'],['ثانية كبيرة','C4 D4 C4+D4:2'],['رابعة','C4 F4 C4+F4:2'],['تريتون','C4 F#4 C4+F#4:2'],['خامسة','C4 G4 C4+G4:2'],['سادسة كبيرة','C4 A4 C4+A4:2'],['سابعة كبيرة','C4 B4 C4+B4:2']]},
{t:'التأليف وبناء المقطوعة',lv:'احترافي',h:`<p>ابدأ بـ<b>موتيف</b> (نواة لحنية من 3 إلى 5 نوت) ثم طوّره بالتكرار والمتتالية (نقله لدرجة أخرى) والعكس. اجعل العبارة <b>سؤالاً وجواباً</b>: الأولى تنتهي معلّقة والثانية تقفل.</p><p>أشكال شائعة: <b>AABA</b> (الأغنية الكلاسيكية)، و<b>مقطع–كورس</b> (Verse–Chorus). هيكل أكوردات آمن: I – vi – IV – V.</p><div class="note">اكتب ألحانك بصيغة النوت واحفظها في مكتبة hussein piano ضمن تبويب التدريب.</div>`,d:[['سؤال وجواب','C4 E4 G4 E4 C4 E4 G4:2 D4 F4 A4 F4 D4 G4 C4:3']]},
